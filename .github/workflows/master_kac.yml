name: KAC CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kac
          POSTGRES_PASSWORD: kac_ci_password
          POSTGRES_DB: kac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kac -d kac_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://kac:kac_ci_password@localhost:5432/kac_test
      API_PORT: 4000
      API_CORS_ORIGINS: http://localhost:8081,http://localhost:8080,http://localhost:3000
      EXPO_PUBLIC_API_URL: ${{ vars.KAC_API_URL }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install workspace dependencies
        run: npm ci

      - name: Require the single-App-Service public origin for deployments
        if: github.event_name != 'pull_request'
        env:
          KAC_API_URL: ${{ vars.KAC_API_URL }}
        run: |
          test -n "$KAC_API_URL"
          case "$KAC_API_URL" in
            https://*) ;;
            *) echo "KAC_API_URL must be the HTTPS origin of KAC (without /api/v1)." >&2; exit 1 ;;
          esac

      - name: Enforce versioned OpenAPI contract
        run: npm run api:openapi:check

      - name: Check model and apply database migrations
        run: |
          npm run db:check
          npm run db:migrate
          npm run db:seed

      - name: Typecheck all projects
        run: npm run typecheck

      - name: Test frontend and API
        run: npm test

      - name: Verify API reads the seeded PostgreSQL calendar
        run: npm run test:api:db

      - name: Build frontend, backend and bilingual documentation
        run: npm run build

      - name: Prepare unified frontend, API and worker package
        run: npm run package:deploy --workspace @kac/api

      - name: Verify deployment packages
        run: |
          test -f apps/api/deploy/web/index.html
          test -f apps/api/deploy/web/service-worker.js
          test -f apps/api/deploy/dist/server.js
          test -f apps/api/deploy/dist/worker.js
          test -f apps/api/deploy/node_modules/fastify/package.json
          test -f apps/api/deploy/App_Data/jobs/continuous/kac-outbox/run.sh
          test -f apps/api/deploy/App_Data/jobs/continuous/kac-outbox/settings.job

      - name: Upload unified KAC deployment package
        uses: actions/upload-artifact@v6
        with:
          name: kac-app
          path: apps/api/deploy/

  deploy-app:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: build-and-test
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download unified KAC package
        uses: actions/download-artifact@v7
        with:
          name: kac-app
          path: app-package

      - name: Sign in to Azure
        uses: azure/login@v3.1.0
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_94A10D8762FE4A29B43EAEF6FB30E582 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_348FBFF3B5BD408BBBFD5B656B478EB7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_BC4E5D8B5D42471DBFA98CF110CDE0A2 }}

      - name: Deploy the unified web and API app to KAC
        uses: azure/webapps-deploy@v3
        with:
          app-name: KAC
          slot-name: Production
          package: app-package
          startup-command: npm start
