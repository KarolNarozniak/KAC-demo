services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kac}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kac_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-kac_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - kac_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kac} -d ${POSTGRES_DB:-kac_dev}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  kac_postgres_data:
