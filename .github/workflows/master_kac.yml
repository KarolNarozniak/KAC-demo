# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
name: Build and deploy KAC demo

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and build web app
        run: |
          npm run typecheck
          npm test
          npm run build:web
          test -f dist/index.html

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: kac-webapp
          path: |
            dist/
            server.mjs
            package.json

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: kac-webapp

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_ACF6D82F1E154A36B9720554106CD293 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3729A1EF6F234538BC1432B980EB2795 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_45A99EA2BA1A4A9F886230D96E72A1D0 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: Kac-demo
          package: .
